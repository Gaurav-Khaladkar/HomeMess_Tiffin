<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <!-- Thali Brass Gradient -->
    <radialGradient id="brassThali" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="50%" stop-color="#fbc02d" />
      <stop offset="85%" stop-color="#f57f17" />
      <stop offset="100%" stop-color="#bf360c" />
    </radialGradient>

    <!-- Katori Bowl Gradients -->
    <radialGradient id="dalKatori" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff9c4" />
      <stop offset="65%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#f57f17" />
    </radialGradient>

    <radialGradient id="amtiKatori" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffcc80" />
      <stop offset="70%" stop-color="#ef6c00" />
      <stop offset="100%" stop-color="#bf360c" />
    </radialGradient>

    <radialGradient id="bhajiKatori" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="60%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#e65100" />
    </radialGradient>

    <radialGradient id="sweetKatori" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fff9c4" />
      <stop offset="100%" stop-color="#ffd54f" />
    </radialGradient>
  </defs>

  <style>
    @keyframes radarPing {
      0% { r: 24px; opacity: 0.8; stroke-width: 2.5px; }
      100% { r: 42px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes katoriHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes steamWhirl {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-20px) rotate(10deg); opacity: 0; }
    }

    .ping-circle {
      animation: radarPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .katori-1 { animation: katoriHover 3s ease-in-out infinite; }
    .katori-2 { animation: katoriHover 3.4s ease-in-out infinite 0.5s; }
    .katori-3 { animation: katoriHover 3.2s ease-in-out infinite 1s; }
    .katori-4 { animation: katoriHover 3.6s ease-in-out infinite 1.5s; }
    .steam-soft { animation: steamWhirl 2.4s ease-out infinite; }
  </style>

  <!-- Background Container -->
  <rect width="880" height="280" rx="14" fill="#140a02" stroke="#ff6f00" stroke-width="1" />

  <!-- ============================================== -->
  <!-- LEFT: THE INTERACTIVE THALI WITH KATORIS -->
  <!-- ============================================== -->
  <g transform="translate(150, 140)">

    <!-- Brass Thali Outer Plate -->
    <circle cx="0" cy="0" r="115" fill="url(#brassThali)" stroke="#ffd54f" stroke-width="3" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.6))" />
    <circle cx="0" cy="0" r="105" fill="#3e2723" opacity="0.35" />

    <!-- Center: Steamed Rice with Jeera -->
    <ellipse cx="0" cy="0" rx="35" ry="24" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" />
    <circle cx="-6" cy="-2" r="1.5" fill="#424242" />
    <circle cx="8" cy="4" r="1.5" fill="#424242" />
    <circle cx="4" cy="-5" r="1.2" fill="#424242" />
    <!-- Coriander garnish on rice -->
    <path d="M-2,-1 Q4,-6 6,-2 Q0,-1 -2,-1" fill="#2e7d32" />

    <!-- Fresh Soft Phulka Chapatis (Folded with Ghee) -->
    <g transform="translate(0, 48)">
      <path d="M-40,0 Q0,25 40,0 Q0,-15 -40,0 Z" fill="#ffe0b2" stroke="#d7ccc8" stroke-width="1.5" />
      <path d="M-30,5 Q0,22 30,5" stroke="#ffb74d" stroke-width="2" fill="none" opacity="0.8" />
      <circle cx="-10" cy="4" r="2" fill="#d7ccc8" />
      <circle cx="15" cy="8" r="1.5" fill="#d7ccc8" />
    </g>

    <!-- KATORI 1: DAL TADKA (Top-Left) -->
    <g class="katori-1" transform="translate(-62, -58)">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#ffd54f" class="ping-circle" />
      <circle cx="0" cy="0" r="24" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2" />
      <circle cx="0" cy="0" r="21" fill="url(#dalKatori)" />
      <circle cx="-2" cy="0" r="1.5" fill="#3e2723" />
      <circle cx="5" cy="-3" r="1.2" fill="#bf360c" />
    </g>

    <!-- KATORI 2: KATACHI AMTI (Top-Right) -->
    <g class="katori-2" transform="translate(62, -58)">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#ff9800" class="ping-circle" style="animation-delay: 0.6s;" />
      <circle cx="0" cy="0" r="24" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2" />
      <circle cx="0" cy="0" r="21" fill="url(#amtiKatori)" />
      <circle cx="3" cy="2" r="1.5" fill="#e65100" />
      <circle cx="-4" cy="-3" r="1.2" fill="#ffd54f" />
    </g>

    <!-- KATORI 3: SUKHI BATATA BHAJI (Left) -->
    <g class="katori-3" transform="translate(-75, 10)">
      <circle cx="0" cy="0" r="23" fill="none" stroke="#ffb300" class="ping-circle" style="animation-delay: 1.2s;" />
      <circle cx="0" cy="0" r="22" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2" />
      <circle cx="0" cy="0" r="19" fill="url(#bhajiKatori)" />
      <rect x="-6" y="-6" width="6" height="6" rx="1.5" fill="#ffe082" />
      <rect x="2" y="-3" width="5" height="5" rx="1.5" fill="#ffd54f" />
    </g>

    <!-- KATORI 4: KESAR SHRIKHAND (Right) -->
    <g class="katori-4" transform="translate(75, 10)">
      <circle cx="0" cy="0" r="23" fill="none" stroke="#fff59d" class="ping-circle" style="animation-delay: 1.8s;" />
      <circle cx="0" cy="0" r="22" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2" />
      <circle cx="0" cy="0" r="19" fill="url(#sweetKatori)" />
      <!-- Saffron Strands -->
      <line x1="-3" y1="-2" x2="3" y2="2" stroke="#d84315" stroke-width="1.2" />
      <line x1="1" y1="-3" x2="-2" y2="4" stroke="#e64a19" stroke-width="1" />
    </g>

    <!-- Crisp Papad -->
    <path d="M-80,-15 Q-55,-40 -35,-20" stroke="#ffe082" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9" />

  </g>

  <!-- ============================================== -->
  <!-- RIGHT: THE NUTRITIONAL & CULINARY PROMISES -->
  <!-- ============================================== -->
  <g transform="translate(320, 32)">

    <!-- Badge -->
    <rect x="0" y="0" width="190" height="26" rx="13" fill="#2e7d32" opacity="0.25" stroke="#4caf50" stroke-width="1" />
    <text x="14" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5d6a7" letter-spacing="0.5">
      🌿 100% HOMESTYLE NUTRITION
    </text>

    <!-- Headline -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff">
      The "Little Bowls" (Katori) Promise
    </text>

    <!-- 4 Value Rows -->
    <g transform="translate(0, 75)">

      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="16" font-size="16">🥣</text>
        <text x="28" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffd54f">
          Balanced Macro-Nutrients:
        </text>
        <text x="210" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#b0bec5">
          Dedicated protein (Dal/Sprouts), carbs (Rice/Roti) &amp; vitamins (Sabzi).
        </text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 34)">
        <text x="0" y="16" font-size="16">🫓</text>
        <text x="28" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffb74d">
          Hot Phulka Chapatis:
        </text>
        <text x="180" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#b0bec5">
          Made fresh on tawa with Sharbati wheat flour &amp; pure cow ghee.
        </text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 68)">
        <text x="0" y="16" font-size="16">🧂</text>
        <text x="28" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#81c784">
          Zero Preservatives / No Soda:
        </text>
        <text x="235" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#b0bec5">
          Cooked with traditional stone-ground Maharashtrian spices.
        </text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 102)">
        <text x="0" y="16" font-size="16">⏱️</text>
        <text x="28" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#80deea">
          Packed Under 15 Minutes:
        </text>
        <text x="195" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#b0bec5">
          Sealed directly from gas stove into stainless steel tiffin dabbas.
        </text>
      </g>

    </g>

  </g>
</svg>
